<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Electricsim · DC Circuit Lab</title><meta name="description" content="Add batteries, resistors and capacitors to a blank circuit canvas."><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="research-theme.css?v=2"><link rel="stylesheet" href="dc-circuit.css"></head>
<body><canvas id="bgCanvas" aria-hidden="true"></canvas>
<header class="dc-top"><a href="index.html">← Electricsim</a><h1>DC Circuit Lab</h1><div><button id="undoBtn" title="Undo · Ctrl+Z">Undo</button><button id="clearBtn">Clear</button></div></header>
<main><nav class="dc-tools" aria-label="Circuit tools"><button data-tool="select" aria-pressed="true">↖ Move / edit</button><button data-tool="resistor" aria-pressed="false">▱ Resistor</button><button data-tool="capacitor" aria-pressed="false">⊣⊢ Capacitor</button><button data-tool="voltage" aria-pressed="false">＋− Battery</button><button data-tool="wire" aria-pressed="false">└─ Wire</button></nav>
<p id="toolHint">Choose a component and click the canvas to place it. Click a component to edit.</p>
<section class="dc-space" aria-label="Circuit workspace"><canvas id="circuitCanvas" tabindex="0" role="img" aria-label="Blank circuit canvas. Select a component tool and click to place it; Wire connects clicked junctions." aria-describedby="toolHint"></canvas>
<form id="componentEditor" hidden><strong id="selectedTitle"></strong><div class="dc-value"><label for="valueInput">Value</label><input id="valueInput" type="number" step="any" required><select id="unitSelect" aria-label="Unit"></select><button type="submit">Apply</button></div><div class="dc-edit-actions"><button type="button" id="rotateBtn">Rotate</button><button type="button" id="deleteBtn">Delete</button><button type="button" id="closeEditorBtn" aria-label="Close editor">Done</button></div></form>
</section><div class="dc-bottom"><button id="runBtn" aria-pressed="false" disabled>▶ Run</button><p id="status" role="status" aria-live="polite">Add components to start.</p></div></main>
<script src="dc-circuit-model.js?v=readouts-2"></script><script src="dc-circuit-topology.js"></script><script src="dc-circuit-solver.js"></script><script src="dc-circuit-editor.js?v=orthogonal-1"></script><script src="dc-circuit-renderer.js?v=orthogonal-1"></script><script src="dc-circuit.js?v=orthogonal-1"></script><script src="shared-bg.js"></script></body></html>
